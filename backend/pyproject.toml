[project]
name = "hackverse-backend"
version = "0.1.0"
description = "FastAPI backend for HackVerse."
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "fastapi>=0.115.0",
    "google-auth>=2.35.0",
    "greenlet>=3.0.0",
    "httpx>=0.27.0",
    "pydantic-settings>=2.5.0",
    "python-multipart>=0.0.12",
    "redis>=5.0.0",
    "requests>=2.32.0",
    "sqlalchemy>=2.0.0",
    "structlog>=24.4.0",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
    "fakeredis>=2.25.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
